# Activate with the runtime variable SPRING_PROFILES_ACTIVE=northflank.
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
        tcpKeepAlive: true
